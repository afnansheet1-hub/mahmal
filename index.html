<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>الموقع تحت الصيانة</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #0f1512;
        --card: rgba(255, 255, 255, 0.94);
        --ink: #14201b;
        --muted: #66736c;
        --accent: #0f766e;
        --line: rgba(20, 32, 27, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        color: var(--ink);
        font-family: Tahoma, Arial, sans-serif;
        background:
          linear-gradient(rgba(247, 249, 245, 0.84), rgba(247, 249, 245, 0.92)),
          url("./assets/match-logo-bg.webp") center / min(920px, 94vw) auto no-repeat fixed,
          var(--bg);
      }

      main {
        width: min(620px, 100%);
        padding: clamp(28px, 6vw, 54px);
        text-align: center;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--card);
        box-shadow: 0 24px 70px rgba(5, 15, 11, 0.18);
      }

      .logo {
        width: 96px;
        height: 96px;
        object-fit: contain;
        margin-bottom: 22px;
      }

      h1 {
        margin: 0 0 14px;
        font-size: clamp(28px, 5vw, 42px);
        line-height: 1.25;
        letter-spacing: 0;
      }

      p {
        margin: 0 auto;
        max-width: 440px;
        color: var(--muted);
        font-size: 18px;
        line-height: 1.9;
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        margin-top: 26px;
        padding: 10px 16px;
        border: 1px solid rgba(15, 118, 110, 0.22);
        border-radius: 999px;
        color: var(--accent);
        background: rgba(15, 118, 110, 0.08);
        font-weight: 700;
      }

      .status::before {
        content: "";
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: currentColor;
      }
    </style>
  </head>
  <body>
    <main aria-label="الموقع تحت الصيانة">
      <img class="logo" src="./assets/match-home-logo.png" alt="Match" />
      <h1>الموقع تحت الصيانة مؤقتاً</h1>
      <p>نعمل حالياً على تحديث المستخرج اليومي وتحسين قراءة عروض PDF. سنعود قريباً.</p>
      <div class="status">صيانة مؤقتة</div>
    </main>
  </body>
</html>
